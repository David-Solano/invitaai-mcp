[project]
name = "invitaai-mcp"
version = "0.1.0"
description = "MCP server to create and manage InvitaAI events and invitations from Claude Code, Codex or any MCP client."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "David Flores Solano" }]
dependencies = [
    "mcp>=2.2,<3",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "anyio>=4"]

[project.scripts]
invitaai-mcp = "invitaai_mcp.server:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
